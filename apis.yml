aid: docai
name: doc.ai
description: 'doc.ai, Inc. was a privacy-first enterprise artificial intelligence platform for healthcare,
  founded by Sam De Brouwer and Walter De Brouwer. It ran decentralized "data trials" that let individuals
  contribute and train models on their own genomic, pharmacogenomic, exposomic, wellness and hematology
  data, and it issued the $NRN (Neuron) token in a sale that closed in October 2017 — which is why it is
  carried in the Pantera Capital portfolio under the crypto sector despite being a digital-health AI
  business. Sharecare, Inc. completed its acquisition of doc.ai on 2021-02-23, absorbing the Unwinding
  Anxiety, Serenity, VERIFIED and Passport products and retaining both founders as executives. The doc.ai
  brand is retired: the apex domain no longer resolves to a website (last archived HTTP 200 on 2023-04-16)
  and no doc.ai developer portal, API, or specification could be located.'
